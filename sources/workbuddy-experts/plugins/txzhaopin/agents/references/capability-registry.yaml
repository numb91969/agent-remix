{
  "schema_version": "1.0",
  "risk_policy": {
    "R0": "不涉及可识别自然人的公开行业、公司、岗位或政策信息，只读",
    "R1": "涉及腾讯内部数据、内部评估资产，或任何可识别员工/候选人的信息，只读",
    "R2": "对外发送、业务回写、流程推进、约面、改面、取消、面评提交、消息或外呼等副作用操作"
  },
  "coverage_policy": {
    "purpose": "route-decision 的 coverage 字段必须按本判据判定，不得凭直觉。缺少统一判据时模型会倾向填 full，导致 fallback 形同虚设。",
    "full_when": [
      "用户请求的每个动作都能在命中 Skill 的 summary、flows 或输出契约里找到对应项",
      "不需要该 Skill 未定义的任何实时查询或平台动作"
    ],
    "partial_when": [
      "至少一个核心动作由命中 Skill 覆盖，且该 Skill 仍是流程 owner",
      "缺失部分属于腾讯招聘平台的实时查询或动作，而非方法论、内容生成或数仓指标"
    ],
    "none_when": [
      "用户目标中没有任何核心动作属于现有 Skill",
      "注册表召回的前 3 个能力与多 Skill 组合都无法覆盖"
    ],
    "undetermined_when": [
      "用户尚未说明要执行的动作或业务对象",
      "多个业务方向都成立，必须先用一个高信息量问题澄清"
    ],
    "must_not_fallback_when": [
      "命中 Skill 已完整覆盖（coverage=full）",
      "缺口属于「当前已知不覆盖」清单（如入职材料办理、Offer 审批流本身）",
      "缺口属于纯方法论、内容生成、HR 数仓指标、前端开发或外部互联网研究"
    ],
    "must_not_fallback_categories": [
      "full_coverage",
      "known_unsupported",
      "methodology_or_content",
      "hr_data_or_metrics",
      "frontend_or_file",
      "external_research"
    ],
    "known_unsupported": [
      "入职材料办理",
      "Offer 审批流本身",
      "测验平台出题和阅卷写回",
      "校招猎头推荐"
    ],
    "owner_by_coverage": {
      "full": "selected_skill",
      "partial": "selected_skill",
      "none": null,
      "undetermined": null
    },
    "owner_rule": "coverage=partial 时 owner_skill 必须保留为命中的业务 Skill；coverage=none|undetermined 时 owner_skill 为 null",
    "default_when_uncertain": "partial 与 full 难以区分时按 partial 处理（宁可多查一次实时能力，也不要谎称已覆盖）"
  },
  "mcp_fallback_policy": {
    "skill": "mcp-capability-explorer",
    "server": "recruit-mcp",
    "activation": ["partial_skill_coverage", "no_skill_coverage"],
    "eligible_need": "缺失部分需要腾讯招聘平台的实时数据或业务动作",
    "clarification_gate": {
      "required_before_discovery": ["action", "business_object", "platform_need"],
      "max_clarification_rounds": 1,
      "on_missing": "ask_one_high_information_question",
      "fallback_while_unclear": false
    },
    "discovery_tool": "SearchAPI",
    "require_detail_before_call": true,
    "discovery_budget": {
      "scope": "user_task",
      "max_query_calls": 2,
      "max_detail_calls": 3,
      "max_total_searchapi_calls": 5,
      "soft_deadline_seconds": 45,
      "hard_deadline_seconds": 90,
      "candidate_expansion": "top_1_then_on_demand",
      "stop_on_repeated_query": true,
      "stop_on_repeated_candidate_set": true,
      "max_consecutive_no_information_gain": 2
    },
    "max_business_steps": 5,
    "dynamic_read_execution": true,
    "dynamic_write_execution": "handoff_to_registered_owner",
    "fail_closed": true,
    "excludes": [
      "已被现有 Skill 完整覆盖",
      "纯方法论或内容生成",
      "HR 数仓和治理指标查询",
      "前端开发或文件处理",
      "外部互联网研究"
    ]
  },
  "routing_schema_version": "1.0",
