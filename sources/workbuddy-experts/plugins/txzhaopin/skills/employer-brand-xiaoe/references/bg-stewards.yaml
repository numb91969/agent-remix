# BG 接口人配置（Stewards）
#
# 用途：
# 当用户向「雇主品牌小鹅」投喂某个 BG 的资料时，小鹅会自动识别 BG，
# 并提示用户将「投喂消化简报」回传给该 BG 的雇主品牌接口人审核入库。
# 接口人对自己 BG 的资料负责，Effy 作为总负责人做品牌调性 + 红线把关。
#
# 维护规则：
# 1. 任何时候都可以动态新增/修改 steward
# 2. 一个 BG 至少配 1 个 primary，可选 1-2 个 backup
# 3. 删除接口人时，请同步告知该 BG 同事另寻接口人
# 4. owner 字段是该专家的总把关人，不可删除
# 5. 字段说明：
#    - displayName: 用于对外展示的称呼
#    - contact: 联系方式（企业微信/邮箱/工号，自由格式）
#    - scope: 该接口人负责的内容范围
#
# ⚠️ 注意：这个配置文件不上传外部公开渠道，仅用于专家内部路由

version: "1.0"
lastUpdated: "2026-06-01"

# 总负责人（专家 owner）
owner:
  displayName: "Effy"
  role: "雇主品牌团队 - 总负责人"
  contact: "（请补充）"
  responsibility:
